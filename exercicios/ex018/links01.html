<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: sans-serif;
            background-color: rgb(53, 11, 11);
        }
        a{
            color: rgb(136, 255, 0);
            text-decoration: none;
        }
        a:hover{
            color: rgb(255, 0, 0);
            text-decoration: underline;
        }
        a:active{
            color: rgb(0, 0, 255);
        }
        a:visited{
            color: rgb(255, 255, 0);
        }
        a::after{
            content: " (clique no link)";
            text-decoration: none;
            font-weight: bold;
            color: aquamarine;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li> <a href="upiB0oQvVMhttps://youtu.be/bbT_a7n5D7U?si=zBwQ3s" target="_blank"> Computação</a></li>
        <li><a href="https://gartic.io" target="_blank">Games</a></li>
        <li><a href="https://ge.globo.com" target="_blank">Futebol</a></li>

    </ul>
</body>
</html>
