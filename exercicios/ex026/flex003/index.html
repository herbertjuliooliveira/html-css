<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox centralizado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: lightcoral;
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightblue;
            width: 100vw;
            height: 80vh;
        }
        section {
            background-color: yellow;
            width: 250px;
            height: 250px;

        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Flexbox centralizado</h1>
        </section>
    </main>
</body>
</html>
