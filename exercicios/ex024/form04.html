<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> formulario</title>
</head>
<body>
    <h1>exemplo de formulario</h1>
    <form action="cadastro.java" method="get">
        <fieldset >
            <legend> Digite Seus dados</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nom" id="inome" required
                 autocomplete="name" placeholder="Digite seu nome">
            </p>
            <p>
                <label for="iemail">Email:</label>
                <input type="email" name="email" id="iemail" required autocomplete="email" placeholder="Digite seu email">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" required autocomplete="tel" placeholder="xxxxxxxxx" pattern="\(\d{2}\)\d{4,5}-\d{4}">
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
