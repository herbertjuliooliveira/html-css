<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cadastro.java" method="post" autocomplete="on">
       <p>
        <label for="iusu">Usuário</label>
        <input type="text" name="usu" id="iusu" required autocomplete="username" placeholder="Digite o nome.">
       </p>
       <p>
        <label for="isen">Senha</label>
        <input type="password" name="sen" id="isen" required minlength="8" autocomplete="current-password" placeholder="Digite sua senha.">
       </p>
       <p>
        <input type="submit" value="Cadastra-se">
        <input type="reset" value="Limpar">
       </p>
    </form>
</body>
</html>
