<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.java">
        <label for="iano">Ano que você nasceu</label>
        <input type="number" name="ano" id="iano" min="1910" max="2026" required oninput="calcIdade()">
        <p>
            <p>
                <label for="iidad">Sua idade é:</label>
                <output id="iidad">0</output>
            </p>
            <input type="reset" value="Limpar">
             <input type="submit" value="Enviar">
        </p>
    </form>
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidad.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
