<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <style>
       
    </style>
</head>
<body>
        <h1>Testando Formulario</h1>
        <form action="cadastro.java" method="post">
           <fieldset>
            <legend>Seu sexo</legend>
            <input type="radio" name="sex" id="imasc" required > 
            <label for="imasc">Masculino</label> <br>
            <input type="radio" name="sex" id="ifemi" required> 
            <label for="ifemi">Feminino</label> <br>
           </fieldset>
           <fieldset>
            <legend>Quais seus esportes favoritos</legend>
            <input type="checkbox" name="fut" id="ifut"> 
            <label for="ifut">Futebol</label> <br>
            <input type="checkbox" name="fut" id="ibas"> 
            <label for="ibas">Basqueste</label> <br>
            <input type="checkbox" name="fut" id="ivol"> 
            <label for="ivol">Volei</label> <br>
            <input type="checkbox" name="fut" id="iten"> 
            <label for="iten">Tênis</label> <br>
            <input type="checkbox" name="fut" id="ihan"> 
            <label for="ihan">Handebol</label> <br>
            <input type="checkbox" name="fut" id="inat"> 
            <label for="inat">Natação</label> <br>
        </fieldset>
        </form>
</body>
</html>
