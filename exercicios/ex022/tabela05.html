<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Exercícios de tabela</title>
    <style>
        table {
            width: 400px;
            border-collapse: collapse;
        }
        caption {
            font-size: 20px;
            padding: 10px;
        }
        th , td {
            border: 1px solid black;
            text-align: center;
        }

    </style>
</head>
<body>
    <h1>Exercício de tabela</h1>
    <table>
        <caption>Cadastro</caption>
        <tr>
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
    </table>
</body>
</html>
